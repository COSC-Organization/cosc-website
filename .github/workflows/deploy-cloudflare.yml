name: Deploy to Cloudflare Pages

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: cf-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 5

      - name: Create GitHub Deployment
        uses: chrnorm/deployment-action@v2
        id: deployment
        with:
          token: '${{ github.token }}'
          environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}

      - name: Build static site
        run: pnpm build
        timeout-minutes: 10

      - name: Deploy to Cloudflare Pages
        id: cf_deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy out
            --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }}
            --branch=${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      # `deployment-url` can arrive without a scheme or with a trailing
      # "(custom domain)" suffix, so pull the URL out of the raw command
      # output first and fall back to the structured output.
      - name: Resolve deployment URL
        id: url
        env:
          RAW_OUTPUT: ${{ steps.cf_deploy.outputs.command-output }}
          FALLBACK: ${{ steps.cf_deploy.outputs.deployment-url }}
        run: |
          url=$(printf '%s' "$RAW_OUTPUT" \
            | grep -oE 'https://[A-Za-z0-9._-]+\.pages\.dev' \
            | tail -n 1)
          if [[ -z "$url" && -n "$FALLBACK" ]]; then
            url=$(printf '%s' "$FALLBACK" | grep -oE '[A-Za-z0-9._-]+\.pages\.dev' | tail -n 1)
            [[ -n "$url" ]] && url="https://$url"
          fi
          echo "value=$url" >> "$GITHUB_OUTPUT"

      - name: Update GitHub Deployment Status
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: '${{ github.token }}'
          environment-url: ${{ steps.url.outputs.value }}
          state: 'success'
          description: 'Cloudflare Pages deployment is live!'
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Update GitHub Deployment Failure
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token: '${{ github.token }}'
          state: 'failure'
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}

      - name: PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.url.outputs.value }}';
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Cloudflare Pages preview ready!\n\n[View Deployment](${url})`
            });

      - name: Summary
        if: always()
        run: |
          echo "Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "Event: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "URL: ${{ steps.url.outputs.value }}" >> $GITHUB_STEP_SUMMARY
